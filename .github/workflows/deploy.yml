name: Deploy website to Hostinger

# Runs automatically every time the main branch changes,
# and uploads the site files to Hostinger over FTP.
on:
  push:
    branches:
      - main
  workflow_dispatch:  # lets you trigger it manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the latest files
        uses: actions/checkout@v4

      - name: Upload to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          # Don't upload repo housekeeping files to the live site
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
